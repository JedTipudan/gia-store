name: gia_foodies
description: Gia Foodies - Paluwagan & Food Store System
publish_to: 'none'
version: 1.0.2+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.0.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  intl: ^0.20.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2
  share_plus: ^10.0.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#16a34a"
  adaptive_icon_foreground: "assets/logo.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
