spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/paluwagan_store?useSSL=false&serverTimezone=Asia/Manila&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:redprince}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${JWT_SECRET:PaluwaganStoreSecretKey2024SuperLongSecretForHS256Algorithm}
app.jwt.expiration=86400000

server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.web.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}
