name: Build Flutter APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: 'stable'

      - name: Get current version from pubspec
        id: get_version
        run: |
          VERSION=$(grep '^version:' mobile/pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          BUILD=${{ github.run_number }}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "App version: $VERSION+$BUILD"

      - name: Update pubspec version with build number
        run: |
          sed -i "s/^version:.*/version: ${{ steps.get_version.outputs.version }}+${{ steps.get_version.outputs.build }}/" mobile/pubspec.yaml

      - name: Sync version.txt with current version
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          sed -i "s/^version=.*/version=$VERSION/" version.txt
          echo "Synced version.txt to $VERSION"
          cat version.txt

      - name: Commit version.txt back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt mobile/pubspec.yaml
          git diff --staged --quiet || git commit -m "ci: sync version.txt to ${{ steps.get_version.outputs.version }}"
          git push

      - name: Get dependencies
        run: flutter pub get
        working-directory: mobile

      - name: Generate app icons
        run: dart run flutter_launcher_icons
        working-directory: mobile

      - name: Build APK
        run: flutter build apk --release --build-number=${{ steps.get_version.outputs.build }}
        working-directory: mobile

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gia-foodies-v${{ steps.get_version.outputs.version }}-build${{ steps.get_version.outputs.build }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}-${{ steps.get_version.outputs.build }}
          name: Gia Foodies v${{ steps.get_version.outputs.version }} (Build ${{ steps.get_version.outputs.build }})
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          body: |
            ## Gia Foodies v${{ steps.get_version.outputs.version }}

            Download the APK below and install on your Android phone.

            **How to install:**
            1. Download `app-release.apk`
            2. Open the file on your phone
            3. Allow installation from unknown sources if prompted
            4. Install and open the app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
